<!--
  Valentte · AM email resend · apology banner
  Drop this block in as the FIRST row of the email body (directly under the Aiden Header).
  600px wide, live HTML text on a flat cream background (no image hosting needed).
  Before sending: swap the CTA href for the AM email's landing page URL + UTMs.
-->
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center" style="width:600px;max-width:100%;background-color:#F4EDE3;border-collapse:collapse;">
  <tr>
    <td align="center" style="padding:32px 40px 34px 40px;">

      <!-- Eyebrow -->
      <p style="margin:0 0 12px 0;font-family:Inter,Helvetica,Arial,sans-serif;font-size:11px;line-height:16px;letter-spacing:2px;text-transform:uppercase;color:#767676;">
        A quick note
      </p>

      <!-- Headline -->
      <h1 style="margin:0 0 14px 0;font-family:Cardo,Georgia,'Times New Roman',serif;font-size:30px;line-height:36px;font-weight:400;color:#212121;">
        Sorry about this morning
      </h1>

      <!-- Short divider -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="border-collapse:collapse;">
        <tr><td width="40" height="1" style="width:40px;height:1px;font-size:0;line-height:0;background-color:#D4A017;">&nbsp;</td></tr>
      </table>

      <!-- Body -->
      <p style="margin:16px 0 0 0;font-family:Inter,Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;color:#212121;">
        Our website had a brief hiccup just as this morning&rsquo;s email went out, so you may not have been able to shop.
      </p>
      <p style="margin:10px 0 24px 0;font-family:Inter,Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;color:#212121;">
        Everything&rsquo;s back up and running, and it&rsquo;s all ready and waiting for you.
      </p>

      <!-- CTA (bulletproof button) -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="border-collapse:collapse;">
        <tr>
          <td align="center" bgcolor="#FFA220" style="background-color:#FFA220;border-radius:4px;">
            <a href="https://www.valentte.com/" target="_blank" style="display:block;padding:14px 34px;font-family:Inter,Helvetica,Arial,sans-serif;font-size:14px;line-height:18px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#212121;text-decoration:none;border-radius:4px;">
              Shop now
            </a>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
